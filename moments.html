<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moments · Stint</title>
    <meta
      name="description"
      content="Stint moment library — desk maintenance packs for eyes, back, and more. Run a pack with a timer or use moments in your sit/stand rhythm."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#141f1c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Stint" />
    <link rel="canonical" href="https://getstint.de/moments.html" />
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('stint.v1')
          var pref = 'system'
          if (raw) {
            var t = JSON.parse(raw).theme
            if (t === 'light' || t === 'dark' || t === 'system') pref = t
          }
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>Stint Moments needs JavaScript. <a href="./">Back to Stint</a></p>
    </noscript>
    <script type="module" src="/src/moments-main.ts"></script>
  </body>
</html>
