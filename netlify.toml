[build]
  # Root npm install → postinstall installs blog/; then app + Astro blog → dist/
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Ensure root asset URLs even if the UI build command omits BASE_PATH.
  BASE_PATH = "/"
  # Astro 7 requires Node >= 22.12
  NODE_VERSION = "22"

# MPA pretty URLs — not a SPA catch-all (analytics/settings stay real HTML files).
[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to = "/analytics.html"
  status = 200

# Astro blog (trailingSlash: always) — built into dist/blog by npm run build.
[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301
