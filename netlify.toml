[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Ensure root asset URLs even if the UI build command omits BASE_PATH.
  BASE_PATH = "/"
  NODE_VERSION = "20"

# MPA pretty URLs — not a SPA catch-all (analytics/settings stay real HTML files).
[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to = "/analytics.html"
  status = 200
