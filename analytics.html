<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics · Stint</title>
    <meta
      name="description"
      content="Local Stint usage analytics — confirmed check-ins, desk switches, and moments. Stored only in your browser."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#141f1c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Stint" />
    <link rel="canonical" href="https://friebe.github.io/mvn/analytics.html" />
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('mvn.v1')
          var pref = 'system'
          if (raw) {
            var t = JSON.parse(raw).theme
            if (t === 'light' || t === 'dark' || t === 'system') pref = t
          }
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" sizes="192x192" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>Stint Analytics needs JavaScript. <a href="./">Back to Stint</a></p>
    </noscript>
    <script type="module" src="/src/analytics-main.ts"></script>
  </body>
</html>
